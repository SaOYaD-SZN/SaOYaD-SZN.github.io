<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">SaOYaD's midnight workspace</title>
<desc id="desc">A cozy anime-inspired developer desk at night, with a glowing monitor, moonlit city, cherry blossoms, tea, headphones and a sleeping cat.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171028"/><stop offset=".55" stop-color="#271943"/><stop offset="1" stop-color="#0d0b19"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#1c1740"/><stop offset="1" stop-color="#0b1024"/></linearGradient>
  <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#342660"/><stop offset=".52" stop-color="#191c42"/><stop offset="1" stop-color="#10172c"/></linearGradient>
  <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#583b64"/><stop offset="1" stop-color="#21182f"/></linearGradient>
  <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#f4bfd9"/><stop offset="1" stop-color="#a66cae"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#8ce5e7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a47be0" stop-opacity=".55"/><stop offset="1" stop-color="#a47be0" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="13" cy="21" r="1.5" fill="#f7dff3" opacity=".7"/><circle cx="62" cy="57" r="1" fill="#a7daf0" opacity=".65"/><circle cx="79" cy="12" r="1" fill="#e6c8fa" opacity=".55"/></pattern>
</defs>
